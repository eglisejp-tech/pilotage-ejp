name: CI

# Toutes les branches : les tests de base de données ne tournent qu'ici tant que Docker
# n'est pas disponible sur le poste de développement.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  base:
    name: Base de données (migrations, RLS, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db

  # Parcours avec une base Supabase locale (jamais un projet distant) : migrations, seed.sql
  # (comptes de test avec mot de passe et facteur TOTP), Auth, API et Mailpit.
  e2e:
    name: Parcours Playwright (1440, 834, 390 px)
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE: '1'
      # Google reste activé dans config.toml : valeurs factices, aucun parcours Google en CI.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-sans-google
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ci-sans-google
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Démarrer Supabase en local (base, Auth, PostgREST, Kong, Mailpit)
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Donner à l'application l'URL et la clé publique locales
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-playwright
          path: test-results/captures/
          retention-days: 7
          if-no-files-found: ignore
