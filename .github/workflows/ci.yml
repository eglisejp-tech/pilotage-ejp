name: CI

# Toutes les branches : les tests de base de données ne tournent qu'ici tant que Docker
# n'est pas disponible sur le poste de développement.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  base:
    name: Base de données (migrations, RLS, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db

  e2e:
    name: Parcours Playwright (1440, 834, 390 px)
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  fonctions:
    name: Edge Functions de comptes (pile locale)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Auth, API, base, boîte mail locale et edge runtime (qui sert supabase/functions) ;
      # les services inutiles à ces tests restent arrêtés.
      - run: npx supabase start -x studio,postgres-meta,imgproxy,storage-api,realtime,logflare,vector,supavisor
      # Adresse et clés de la pile locale, sans les guillemets de la sortie env.
      - name: Environnement de la pile locale
        run: |
          npx supabase status -o env \
            | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' \
            | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' >> "$GITHUB_ENV"
      - run: npm run test:fonctions
      - name: Journal de l'edge runtime
        if: failure()
        run: docker logs "$(docker ps -q --filter name=supabase_edge_runtime)" 2>&1 | tail -n 200
