name: CI

# Toutes les branches : les tests de base de données ne tournent qu'ici tant que Docker
# n'est pas disponible sur le poste de développement.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  base:
    name: Base de données (migrations, RLS, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db

  # Parcours avec une base Supabase locale (jamais un projet distant) : migrations, seed.sql,
  # Auth, API et Mailpit. Avant les parcours, Playwright lance e2e/installer-comptes.ts
  # (mot de passe et facteur TOTP de chaque compte d'exemple, par l'API).
  # Un job par format, plus un pour les écritures, en parallèle : la suite entière dépassait les
  # 30 minutes d'un seul job (8 octobre 2026). Chaque job a sa base locale neuve.
  # Pas d'attente du job « qualite » : chaque job installe tout lui-même, et attendre coûtait
  # 3 minutes à chaque run (mesuré le 12 octobre 2026).
  # Le 23 octobre 2026, le 1440 px (26 minutes, captures comprises) a dépassé trois fois ses
  # 30 minutes : l'installation du navigateur, d'habitude sous 30 secondes, en a pris 5 à 7.
  # Il est coupé en deux moitiés (--shard), et chaque job a 40 minutes de marge.
  e2e:
    name: Parcours Playwright (${{ matrix.partie.nom }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        partie:
          - {
              nom: '1440 px, 1 sur 2',
              projet: ordinateur,
              morceau: '1/2',
              suffixe: '-1',
              ecritures_seules: '0',
            }
          - {
              nom: '1440 px, 2 sur 2',
              projet: ordinateur,
              morceau: '2/2',
              suffixe: '-2',
              ecritures_seules: '0',
            }
          - { nom: '834 px', projet: tablette, morceau: '1/1', suffixe: '', ecritures_seules: '0' }
          - { nom: '390 px', projet: telephone, morceau: '1/1', suffixe: '', ecritures_seules: '0' }
          - {
              nom: 'écritures',
              projet: ecritures,
              morceau: '1/1',
              suffixe: '',
              ecritures_seules: '1',
            }
    env:
      E2E_BASE: '1'
      E2E_ECRITURES_SEULES: ${{ matrix.partie.ecritures_seules }}
      # Google reste activé dans config.toml : valeurs factices, aucun parcours Google en CI.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-sans-google
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ci-sans-google
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # L'edge runtime sert les fonctions de comptes au parcours de l'écran 13
      # (e2e/comptes.ecriture.spec.ts, qui échoue en CI s'il manque).
      - name: Démarrer Supabase en local (base, Auth, PostgREST, Kong, Mailpit, edge runtime)
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,postgres-meta,studio,logflare,vector,supavisor
      # URL et clé publique pour le navigateur (VITE_) ; clé secrète locale pour le seul
      # script d'installation des comptes (E2E_CLE_SECRETE_LOCALE, jamais VITE_), masquée.
      - name: Exporter l'URL et les clés de la base locale
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY" && test -n "$SECRET_KEY"
          echo "::add-mask::$SECRET_KEY"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "E2E_CLE_SECRETE_LOCALE=$SECRET_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      # Le projet choisi entraîne la connexion (dépendance) ; les écritures, seules, n'attendent qu'elle.
      - run: npm run e2e -- --project=${{ matrix.partie.projet }} --shard=${{ matrix.partie.morceau }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright-${{ matrix.partie.projet }}${{ matrix.partie.suffixe }}
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-playwright-${{ matrix.partie.projet }}${{ matrix.partie.suffixe }}
          path: test-results/captures/
          retention-days: 7
          if-no-files-found: ignore

  fonctions:
    name: Edge Functions de comptes (pile locale)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Auth, API, base, boîte mail locale et edge runtime (qui sert supabase/functions) ;
      # les services inutiles à ces tests restent arrêtés.
      - run: npx supabase start -x studio,postgres-meta,imgproxy,storage-api,realtime,logflare,vector,supavisor
      # Adresse et clés de la pile locale, comme le job e2e : la clé secrète est masquée.
      - name: Environnement de la pile locale
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY" && test -n "$SECRET_KEY"
          echo "::add-mask::$SECRET_KEY"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
      - run: npm run test:fonctions
      - name: Journal de l'edge runtime
        if: failure()
        run: docker logs "$(docker ps -q --filter name=supabase_edge_runtime)" 2>&1 | tail -n 200

  # Mise en ligne sur Cloudflare Pages (T70) : seulement sur main, et seulement quand tous les
  # autres jobs sont verts (needs). Le build prend les valeurs publiques de production dans les
  # variables du dépôt (vars, jamais un secret dans le navigateur), puis wrangler publie dist sur
  # le projet pilotage-ejp, branche de production main. Tant que le secret CLOUDFLARE_API_TOKEN
  # n'existe pas, le job s'arrête au vert avec un avertissement et ne publie rien
  # (docs/exploitation.md, section 3.1). Relancer une mise en ligne : Actions, CI, « Run
  # workflow » sur main.
  deploiement:
    name: Mise en ligne (Cloudflare Pages)
    needs: [qualite, base, e2e, fonctions]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Une mise en ligne à la fois : la suivante attend la fin de celle en cours.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      # Seule la présence des secrets est lue ici (vrai ou faux), jamais leur valeur.
      - name: Vérifier les réglages de la mise en ligne
        id: reglages
        env:
          JETON_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          COMPTE_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$JETON_PRESENT" != "true" ]; then
            echo "::warning title=Mise en ligne non faite::Le secret CLOUDFLARE_API_TOKEN n'existe pas encore : rien n'est publié (docs/exploitation.md, section 3.1)."
            echo "pret=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          manque=""
          [ "$COMPTE_PRESENT" = "true" ] || manque="$manque secret CLOUDFLARE_ACCOUNT_ID,"
          [ -n "$VITE_SUPABASE_URL" ] || manque="$manque variable VITE_SUPABASE_URL,"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || manque="$manque variable VITE_SUPABASE_PUBLISHABLE_KEY,"
          [ -n "$VITE_SITE_URL" ] || manque="$manque variable VITE_SITE_URL,"
          if [ -n "$manque" ]; then
            echo "::error title=Mise en ligne arrêtée::Il manque :${manque%,} (docs/exploitation.md, section 3.1)."
            exit 1
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *)
              echo "::error title=Mise en ligne arrêtée::VITE_SUPABASE_PUBLISHABLE_KEY doit être la clé publique (sb_publishable_...), jamais la clé secrète."
              exit 1
              ;;
          esac
          if ! printf '%s' "$VITE_SUPABASE_URL" | grep -Eq '^https://[a-z]{20}\.supabase\.co$'; then
            echo "::error title=Mise en ligne arrêtée::VITE_SUPABASE_URL doit être de la forme https://<identifiant>.supabase.co."
            exit 1
          fi
          if ! grep -F -- "$VITE_SUPABASE_URL" public/_headers | grep -q '^  Content-Security-Policy:'; then
            echo "::error title=Mise en ligne arrêtée::$VITE_SUPABASE_URL n'est pas dans connect-src de public/_headers : le navigateur bloquerait l'outil."
            exit 1
          fi
          case "$VITE_SITE_URL" in
            https://*) ;;
            *)
              echo "::error title=Mise en ligne arrêtée::VITE_SITE_URL doit commencer par https://."
              exit 1
              ;;
          esac
          echo "pret=oui" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.reglages.outputs.pret == 'oui'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.reglages.outputs.pret == 'oui'
        run: npm ci
      - if: steps.reglages.outputs.pret == 'oui'
        run: npm run build
      # Le dossier publié : _headers et _redirects copiés, 404 de /assets/ seulement, aperçu des
      # liens à la bonne adresse, aucune clé secrète.
      - name: Contrôler le dossier dist
        if: steps.reglages.outputs.pret == 'oui'
        run: |
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/assets/404.html
          test ! -e dist/404.html
          grep -qF "content=\"${VITE_SITE_URL%/}/apercu-lien.png\"" dist/index.html
          ! grep -rEq 'sb_secret_[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEYS' dist
      - name: Publier sur Cloudflare Pages
        id: publication
        if: steps.reglages.outputs.pret == 'oui'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          command: pages deploy dist --project-name=pilotage-ejp --branch=main --commit-dirty=true
      - name: Adresse de la mise en ligne
        if: steps.reglages.outputs.pret == 'oui'
        env:
          ADRESSE: ${{ steps.publication.outputs.deployment-url }}
        run: |
          echo "Mise en ligne faite : $ADRESSE (site : $VITE_SITE_URL)" >> "$GITHUB_STEP_SUMMARY"
