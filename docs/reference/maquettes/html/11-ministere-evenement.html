<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajouter un événement, téléphone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Big+Shoulders+Display:wght@700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Public Sans', 'Helvetica Neue', sans-serif;color:#101828;background:#F2F3F5}
a{color:inherit}a:hover{opacity:.8}
</style>
</head>
<body>
<div style="font-family: 'Public Sans', 'Helvetica Neue', sans-serif; color: #101828; background: #F2F3F5; width: 390px; height: 844px; box-sizing: border-box">
<header style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #DCDFE5; background: #FFFFFF">
<a href="#" style="font-size: 15px; color: #1B2E6B; min-height: 44px; display: flex; align-items: center">Annuler</a><span style="font-size: 14px; color: #5F6B7E">Ministère Communication</span></header>
<main style="padding: 26px 20px 20px; display: flex; flex-direction: column; gap: 22px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; line-height: 1.1">Ajouter un événement</h1>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Date</span><div style="height: 52px; border: 1px solid #101828; background: #FFFFFF; padding: 0 14px; font-size: 16px; display: flex; align-items: center; box-sizing: border-box">samedi 10 octobre 2026</div></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Nom de l'événement</span><div style="height: 52px; border: 1px solid #101828; background: #FFFFFF; padding: 0 14px; font-size: 16px; display: flex; align-items: center; box-sizing: border-box">Soirée de louange</div><span style="font-size: 13px; color: #5F6B7E; line-height: 1.45">N'écrivez aucun nom ni information personnelle. Les champs libres sont relus par EJP Tech.</span></label>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Statut</span><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><span style="min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 8px; border: 1px solid #101828; font-size: 15px; line-height: 1.2; background: #FFFFFF; color: #101828; font-weight: 500">Brouillon</span><span style="min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 8px; border: 1px solid #101828; font-size: 15px; line-height: 1.2; background: #101828; color: #FFFFFF; font-weight: 700">En attente de validation</span><span style="min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 8px; border: 1px solid #101828; font-size: 15px; line-height: 1.2; background: #FFFFFF; color: #101828; font-weight: 500">Validé</span><span style="min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 8px; border: 1px solid #101828; font-size: 15px; line-height: 1.2; background: #FFFFFF; color: #101828; font-weight: 500">En préparation</span><span style="min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 8px; border: 1px solid #101828; font-size: 15px; line-height: 1.2; background: #FFFFFF; color: #101828; font-weight: 500">Terminé</span><span style="min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 8px; border: 1px solid #101828; font-size: 15px; line-height: 1.2; background: #FFFFFF; color: #101828; font-weight: 500">Annulé</span></div>
<span style="font-size: 13px; color: #5F6B7E; line-height: 1.45">La validation se fait en dehors de l'outil. Ici, on reporte seulement le statut.</span></div>
<button style="font: 600 15px 'Public Sans', 'Helvetica Neue', sans-serif; min-height: 58px; padding: 0 18px; white-space: nowrap; width: 100%; background: #FFD23F; color: #101828; border: 0">Ajouter au calendrier</button>
</main>
</div>

</body>
</html>
