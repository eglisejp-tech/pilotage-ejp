<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau point d'attention, téléphone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Big+Shoulders+Display:wght@700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Public Sans', 'Helvetica Neue', sans-serif;color:#101828;background:#F2F3F5}
a{color:inherit}a:hover{opacity:.8}
</style>
</head>
<body>
<div style="font-family: 'Public Sans', 'Helvetica Neue', sans-serif; color: #101828; background: #F2F3F5; width: 390px; height: 1160px; box-sizing: border-box">
<header style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #DCDFE5; background: #FFFFFF">
<a href="#" style="font-size: 15px; color: #1B2E6B; min-height: 44px; display: flex; align-items: center">Annuler</a><span style="font-size: 14px; color: #5F6B7E">Ministère Communication</span></header>
<main style="padding: 26px 20px 20px; display: flex; flex-direction: column; gap: 22px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; line-height: 1.1">Nouveau point d'attention</h1>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Titre</span><div style="height: 52px; border: 1px solid #101828; background: #FFFFFF; padding: 0 14px; font-size: 16px; display: flex; align-items: center; box-sizing: border-box">Salle pour la soirée de louange</div></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Ce qui se passe</span><div style="min-height: 110px; border: 1px solid #101828; background: #FFFFFF; padding: 12px 14px; font-size: 16px; line-height: 1.5; box-sizing: border-box">La salle du 10 octobre n'est pas encore confirmée.</div><span style="font-size: 13px; color: #5F6B7E; line-height: 1.45">N'écrivez aucun nom ni information personnelle. Les champs libres sont relus par EJP Tech. <span style="float: right; font-variant-numeric: tabular-nums">51 sur 280</span></span></label>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Priorité</span><div role="radiogroup" style="display: flex; padding-left: 1px"><span style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; background: #FFFFFF; color: #101828; border: 1px solid #101828; margin-left: -1px">Normale</span><span style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; background: #101828; color: #FFFFFF; border: 1px solid #101828; margin-left: -1px">Haute</span><span style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; background: #FFFFFF; color: #101828; border: 1px solid #101828; margin-left: -1px">Urgente</span></div></div>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Ce qui est attendu</span><div style="height: 52px; border: 1px solid #101828; background: #FFFFFF; padding: 0 14px; font-size: 16px; display: flex; align-items: center; box-sizing: border-box">Confirmer la salle</div></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Échéance</span><div style="height: 52px; border: 1px solid #101828; background: #FFFFFF; padding: 0 14px; font-size: 16px; display: flex; align-items: center; box-sizing: border-box">samedi 3 octobre 2026</div></label>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 600">Mentionner un ministère</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><span style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; border: 1px solid #101828; background: #101828; color: #FFFFFF; font-weight: 700">✓ Coordination</span><span style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; border: 1px solid #101828; background: #FFFFFF; color: #101828; font-weight: 500">Intégration</span><span style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; border: 1px solid #101828; background: #FFFFFF; color: #101828; font-weight: 500">Jeunesse</span><span style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; border: 1px solid #101828; background: #FFFFFF; color: #101828; font-weight: 500">Social</span><span style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; border: 1px solid #101828; background: #FFFFFF; color: #101828; font-weight: 500">FIJ</span><span style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; border: 1px solid #101828; background: #FFFFFF; color: #101828; font-weight: 500">Prodiges Junior</span><span style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; border: 1px solid #101828; background: #FFFFFF; color: #101828; font-weight: 500">EJP Formation</span></div>
<span style="font-size: 13px; color: #5F6B7E; line-height: 1.45">Le ministère mentionné verra ce point, et seulement ce point. Le berger et le conseil voient tous les points.</span></div>
<button style="font: 600 15px 'Public Sans', 'Helvetica Neue', sans-serif; min-height: 58px; padding: 0 18px; white-space: nowrap; width: 100%; background: #FFD23F; color: #101828; border: 0">Créer le point</button>
</main>
</div>

</body>
</html>
