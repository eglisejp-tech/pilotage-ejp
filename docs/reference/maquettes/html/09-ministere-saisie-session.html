<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saisir une session, téléphone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Big+Shoulders+Display:wght@700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Public Sans', 'Helvetica Neue', sans-serif;color:#101828;background:#F2F3F5}
a{color:inherit}a:hover{opacity:.8}
</style>
</head>
<body>
<div style="font-family: 'Public Sans', 'Helvetica Neue', sans-serif; color: #101828; background: #F2F3F5; width: 390px; height: 844px; box-sizing: border-box">
<header style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #DCDFE5; background: #FFFFFF">
<a href="#" style="font-size: 15px; color: #1B2E6B; min-height: 44px; display: flex; align-items: center">Retour</a><span style="font-size: 14px; color: #5F6B7E">Ministère Communication</span></header>
<main style="padding: 26px 20px 20px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #5F6B7E">Session déclarée par l'administration</span>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; line-height: 1.1">Bâtir l'Église, samedi 26 septembre</h1></div>
<div style="display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 1px solid #DCDFE5; padding: 18px 16px 16px">
<label style="font-size: 15px; font-weight: 600">STARs de votre ministère présents</label>
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center">
<button aria-label="Retirer un" style="height: 64px; border: 1px solid #101828; background: #FFFFFF; font: 800 34px 'Big Shoulders Display', 'Arial Narrow', sans-serif; color: #101828">−</button>
<span style="text-align: center; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 112px; line-height: .9">13</span>
<button aria-label="Ajouter un" style="height: 64px; border: 0; background: #101828; font: 800 34px 'Big Shoulders Display', 'Arial Narrow', sans-serif; color: #FFFFFF">+</button></div>
<span style="font-size: 13px; color: #5F6B7E; text-align: center">Session précédente : 12</span></div>
<p style="margin: 0; font-size: 15px; line-height: 1.5">6 ministères sur 8 ont déjà saisi. Il manque <strong style="color: #A85A00">Intégration et Coordination</strong>.</p>
<p style="margin: 0; font-size: 13px; color: #5F6B7E">Un nombre de personnes seulement, jamais de noms.</p>
<button style="font: 600 15px 'Public Sans', 'Helvetica Neue', sans-serif; min-height: 58px; padding: 0 18px; white-space: nowrap; width: 100%; background: #FFD23F; color: #101828; border: 0">Enregistrer la présence</button>
</main>
</div>

</body>
</html>
