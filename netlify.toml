# Ancienne adresse de Pilotage EJP (https://pilotage-ejp.netlify.app). Depuis T70 (24 octobre 2026),
# le site est hébergé par Cloudflare Pages : en-têtes dans public/_headers, mise en ligne par la CI
# (job « Mise en ligne »). Ce fichier ne sert plus qu'à renvoyer l'ancienne adresse vers la nouvelle,
# au prochain déploiement que Netlify acceptera ; ensuite, la personne arrête les constructions
# automatiques de Netlify (docs/exploitation.md, section 3.1).
# Ce fichier ne contient aucun secret : seules des adresses publiques y figurent.

# Aucune construction de l'application : la commande crée seulement un dossier presque vide à
# publier (Netlify demande un dossier). Le dépôt n'est jamais publié tel quel. Netlify installe
# quand même les dépendances (package.json) : Node reste celui de .nvmrc.
[build]
  command = "mkdir -p redirection-netlify && echo 'Pilotage EJP a une nouvelle adresse : https://pilotage-ejp.pages.dev' > redirection-netlify/index.html"
  publish = "redirection-netlify"

[build.environment]
  NODE_VERSION = "24"

# Toute adresse, fichiers compris (force), part vers la même adresse du nouveau site, avec un 301.
# Netlify garde les paramètres (?token_hash=... des anciens emails) ; le navigateur garde le #.
# Si Cloudflare a donné une autre adresse que pilotage-ejp.pages.dev, la changer ici aussi.
[[redirects]]
  from = "/*"
  to = "https://pilotage-ejp.pages.dev/:splat"
  status = 301
  force = true
